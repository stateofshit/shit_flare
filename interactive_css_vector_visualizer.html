<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClickPoint Pro & Vector Visualizer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0f19',
                        darkPanel: '#161e2e',
                        accent: '#6366f1',
                        accentHover: '#4f46e5'
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #161e2e;
        }
        ::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4b5563;
        }
    </style>
</head>
<body class="bg-darkBg text-slate-100 h-full flex flex-col overflow-hidden font-sans select-none">

    <!-- Header -->
    <header class="bg-darkPanel border-b border-slate-850 h-14 flex items-center justify-between px-6 shrink-0 z-10">
        <div class="flex items-center gap-3">
            <svg class="w-6 h-6 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/>
            </svg>
            <h1 class="text-md font-bold tracking-wider text-slate-200">ClickPoint Pro Visualizer</h1>
            <span class="bg-indigo-950 text-[10px] text-indigo-300 font-mono px-2.5 py-0.5 rounded border border-indigo-900">1920 × 917 Viewport</span>
        </div>
        
        <div class="flex items-center gap-4">
            <!-- Background Image Upload -->
            <label class="flex items-center gap-1.5 px-3 py-1.5 rounded bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-200 border border-slate-700 transition cursor-pointer">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                <span>Upload Reference Screen</span>
                <input type="file" id="bgUploader" accept="image/*" class="hidden">
            </label>
            <button id="btnToggleGrid" class="px-3 py-1.5 rounded bg-indigo-600/20 hover:bg-indigo-600/30 text-xs font-medium text-indigo-300 border border-indigo-500/30 transition">
                Grid Overlay
            </button>
            <button id="btnReset" class="px-3 py-1.5 rounded bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-300 border border-slate-700 transition">
                Reset View
            </button>
        </div>
    </header>

    <!-- App Container -->
    <div class="flex flex-1 overflow-hidden">
        
        <!-- Workspace Canvas -->
        <div class="flex-1 flex flex-col relative bg-slate-950">
            <!-- Floating Controls -->
            <div class="absolute top-4 left-4 z-10 flex gap-2">
                <div class="bg-slate-900/95 backdrop-blur border border-slate-800 rounded-lg p-1.5 flex gap-1 shadow-2xl">
                    <button id="btnZoomIn" class="p-1.5 hover:bg-slate-800 rounded text-slate-400 hover:text-slate-100 transition" title="Zoom In">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                    </button>
                    <button id="btnZoomOut" class="p-1.5 hover:bg-slate-800 rounded text-slate-400 hover:text-slate-100 transition" title="Zoom Out">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"/></svg>
                    </button>
                    <button id="btnFit" class="p-1.5 hover:bg-slate-800 rounded text-slate-400 hover:text-slate-100 transition" title="Fit Screen">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5v-4m0 4h-4m4 0l-5-5"/></svg>
                    </button>
                </div>
                <div class="bg-slate-900/95 backdrop-blur border border-slate-800 rounded-lg px-3 py-2 flex items-center shadow-2xl text-[11px] font-mono text-slate-400">
                    <span id="coordDisplay">X: 0, Y: 0</span>
                </div>
            </div>

            <!-- Viewport Area -->
            <div id="canvasViewport" class="flex-1 w-full h-full overflow-hidden relative cursor-grab active:cursor-grabbing">
                <svg id="drawingCanvas" class="absolute origin-top-left" width="1920" height="917" viewBox="0 0 1920 917" xmlns="http://www.w3.org/2000/svg">
                    <!-- Dynamic Grid Pattern definitions -->
                    <defs>
                        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.6"/>
                        </pattern>
                        <pattern id="subGrid" width="200" height="200" patternUnits="userSpaceOnUse">
                            <rect width="200" height="200" fill="url(#grid)" />
                            <path d="M 200 0 L 0 0 0 200" fill="none" stroke="#334155" stroke-width="1.2" stroke-opacity="0.4"/>
                        </pattern>
                    </defs>

                    <!-- User Uploaded Screen Template Layer -->
                    <image id="bgTemplate" x="0" y="0" width="1920" height="917" preserveAspectRatio="none" opacity="0.4" class="pointer-events-none" />

                    <!-- Background grids -->
                    <rect id="gridOverlay" width="1920" height="917" fill="url(#subGrid)" class="pointer-events-none"/>
                    <rect width="1920" height="917" fill="none" stroke="#4f46e5" stroke-width="2.5" stroke-dasharray="6,4" stroke-opacity="0.4" class="pointer-events-none"/>

                    <!-- Vector Paths Render Target -->
                    <g id="pathsGroup"></g>

                    <!-- ClickPoint Pro CSS Overlays Target -->
                    <g id="regionsGroup"></g>
                </svg>
            </div>
        </div>

        <!-- Sidebar Panel Controls -->
        <aside class="w-[480px] shrink-0 border-l border-slate-850 bg-darkPanel flex flex-col overflow-hidden h-full">
            <div class="flex border-b border-slate-800 bg-slate-950 shrink-0">
                <button id="tabCss" class="flex-1 py-3.5 text-center text-[11px] font-bold uppercase tracking-wider border-b-2 border-indigo-500 text-slate-100 transition focus:outline-none">
                    CSS Regions
                </button>
                <button id="tabVectors" class="flex-1 py-3.5 text-center text-[11px] font-bold uppercase tracking-wider border-b-2 border-transparent text-slate-400 hover:text-slate-100 transition focus:outline-none">
                    Vector JSON
                </button>
            </div>

            <!-- Tab Container Contents -->
            <div class="flex-1 flex flex-col overflow-hidden relative">
                
                <!-- Tab CSS Regions View -->
                <div id="panelCss" class="absolute inset-0 flex flex-col overflow-hidden p-4 space-y-4">
                    <div class="flex-1 flex flex-col overflow-hidden space-y-3">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-semibold text-slate-400 tracking-wide uppercase">ClickPoint Pro CSS Input</span>
                            <span class="text-[10px] text-slate-500 font-mono">Changes auto-compile</span>
                        </div>
                        <textarea id="cssTextarea" class="w-full flex-1 bg-slate-950 border border-slate-850 rounded-lg p-3 font-mono text-xs text-indigo-300 focus:outline-none focus:border-indigo-500 resize-none overflow-y-auto leading-relaxed" spellcheck="false" placeholder="Paste ClickPoint CSS here..."></textarea>
                    </div>

                    <!-- Interactive Region List Tracker -->
                    <div class="h-44 flex flex-col border-t border-slate-800 pt-3 overflow-hidden">
                        <div class="text-xs font-semibold text-slate-400 tracking-wide uppercase mb-2 flex items-center justify-between">
                            <span>Detected Hotspots</span>
                            <span id="regionCount" class="text-[10px] bg-indigo-950 text-indigo-400 px-2 py-0.5 rounded font-mono">0 Loaded</span>
                        </div>
                        <div id="regionsList" class="flex-1 overflow-y-auto space-y-1.5 pr-1">
                            <!-- Populated on runtime compilation -->
                        </div>
                    </div>
                </div>

                <!-- Tab Vectors View -->
                <div id="panelVectors" class="absolute inset-0 flex flex-col overflow-hidden hidden p-4 space-y-4">
                    <div class="flex-1 flex flex-col overflow-hidden space-y-3">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-semibold text-slate-400 tracking-wide uppercase">Vector Paths JSON</span>
                            <span class="text-[10px] text-slate-500 font-mono">Paths coordinates layout</span>
                        </div>
                        <textarea id="jsonTextarea" class="w-full flex-1 bg-slate-950 border border-slate-850 rounded-lg p-3 font-mono text-xs text-emerald-400 focus:outline-none focus:border-emerald-500 resize-none overflow-y-auto leading-relaxed" spellcheck="false"></textarea>
                    </div>
                    <div class="flex gap-2">
                        <button id="btnApplyJson" class="flex-1 py-2 rounded bg-indigo-600 hover:bg-indigo-500 text-xs font-bold tracking-wider uppercase text-white transition">

                </div>

            </div>
        </aside>

        const btnZoomOut = document.getElementById('btnZoomOut');
        const btnFit = document.getElementById('btnFit');
        const btnApplyJson = document.getElementById('btnApplyJson');

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            cssTextarea.value = initialCSS;
            jsonTextarea.value = JSON.stringify(initialJSON, null, 2);
            
            parseAndCompileCSS();
            renderVectors();
            setupEvents();
            autoFit();
        });

        // Parse absolute percentage bounding boxes from ClickPoint CSS Input
        function parseAndCompileCSS() {
            const rawCss = cssTextarea.value;
            const parsedRegions = [];

            // Pattern to match comments (optionally), class selector, and bounding properties
            const blockRegex = /(?:\/\*\s*([\s\S]*?)\s*\*\/)?\s*\.([\w-]+)\s*\{([\s\S]*?)\}/g;
            let match;

            while ((match = blockRegex.exec(rawCss)) !== null) {
                const rawComment = match[1] ? match[1].trim() : '';
                const className = match[2].trim();
                const styleBody = match[3];

                // Parse internal declarations
                const declarations = {};
                styleBody.split(';').forEach(decl => {
                    const pair = decl.split(':');
                    if (pair.length === 2) {
                        declarations[pair[0].trim()] = pair[1].trim();
                    }
                });

                // Standard absolute metrics extraction
                if (declarations.left && declarations.top && declarations.width && declarations.height) {
                    parsedRegions.push({
                        id: className,
                        label: cleanComment(rawComment) || className,
                        left: parseFloat(declarations.left),
                        top: parseFloat(declarations.top),
                        width: parseFloat(declarations.width),
                        height: parseFloat(declarations.height)
                    });
                }
            }

            state.regions = parsedRegions;
            renderRegions();
            buildRegionsStack();
        }

        // Clean CSS multi-line formatting comments
        function cleanComment(comment) {
            if (!comment) return '';
            return comment.replace(/\*+/g, '').trim();
        }

        // Render ClickPoint region overlays as bounding boxes in workspace SVG
        function renderRegions() {
            regionsGroup.innerHTML = '';

            state.regions.forEach((reg) => {
                // Percentage to absolute viewport conversion
                const x = (reg.left / 100) * state.viewport.width;
                const y = (reg.top / 100) * state.viewport.height;
                const width = (reg.width / 100) * state.viewport.width;
                const height = (reg.height / 100) * state.viewport.height;

                // Interactive outer frame element
                const rectElem = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                rectElem.setAttribute("x", x);
                rectElem.setAttribute("y", y);
                rectElem.setAttribute("width", width);
                rectElem.setAttribute("height", height);
                rectElem.setAttribute("fill", "rgba(99, 102, 241, 0.15)");
                rectElem.setAttribute("stroke", "#6366f1");
                rectElem.setAttribute("stroke-width", "2.5");
                rectElem.setAttribute("class", "cursor-pointer hover:fill-indigo-500/25 transition duration-150");
                rectElem.setAttribute("id", `svg-reg-${reg.id}`);
                rectElem.addEventListener('click', () => selectRegion(reg.id));

                // Label tag
                const textElem = document.createElementNS("http://www.w3.org/2000/svg", "text");
                textElem.setAttribute("x", x + 6);
                textElem.setAttribute("y", y + 16);
                textElem.setAttribute("fill", "#ffffff");
                textElem.setAttribute("font-size", "11px");
                textElem.setAttribute("font-weight", "600");
                textElem.setAttribute("font-family", "monospace");
                textElem.setAttribute("class", "pointer-events-none select-none drop-shadow-md");
                textElem.textContent = reg.label;

                regionsGroup.appendChild(rectElem);
                regionsGroup.appendChild(textElem);
            });
        }

        // Build list elements under Regions panel tab
        function buildRegionsStack() {
            regionsList.innerHTML = '';
            regionCount.textContent = `${state.regions.length} Active`;

            if (state.regions.length === 0) {
                regionsList.innerHTML = `
                    <div class="py-6 text-center text-slate-500 text-xs">
                        No ClickPoint hotspots detected. Add correct properties to the editor.
                    </div>`;
                return;
            }

            state.regions.forEach(reg => {
                const isSelected = state.selectedRegionId === reg.id;
                const card = document.createElement('div');
                card.className = `p-3.5 rounded-lg border text-xs transition duration-150 cursor-pointer ${
                    isSelected ? 'bg-indigo-950/40 border-indigo-500 shadow-md' : 'bg-slate-900 border-slate-850 hover:bg-slate-800'
                }`;
                card.innerHTML = `
                    <div class="flex items-center justify-between font-mono mb-2">
                        <span class="text-indigo-300 font-bold">.${reg.id}</span>
                        <span class="text-slate-500 text-[10px]">${reg.label}</span>
                    </div>
                    <div class="grid grid-cols-4 gap-2 text-[10px] text-slate-400 font-mono">
                        <div>L: <span class="text-slate-200">${reg.left}%</span></div>
                        <div>T: <span class="text-slate-200">${reg.top}%</span></div>
                        <div>W: <span class="text-slate-200">${reg.width}%</span></div>
                        <div>H: <span class="text-slate-200">${reg.height}%</span></div>
                    </div>
                `;
                card.addEventListener('click', () => selectRegion(reg.id));
                regionsList.appendChild(card);
            });
        }

        // Render Shape Vectors from Input JSON
        function renderVectors() {
            pathsGroup.innerHTML = '';

            state.shapes.forEach((shape) => {
                if (shape.type === 'freehand' && shape.data && shape.data.points) {
                    const pathElem = document.createElementNS("http://www.w3.org/2000/svg", "path");
                    let d = `M ${shape.data.points[0].x} ${shape.data.points[0].y}`;
                    for (let i = 1; i < shape.data.points.length; i++) {
                        d += ` L ${shape.data.points[i].x} ${shape.data.points[i].y}`;
                    }

                    pathElem.setAttribute("d", d);
                    pathElem.setAttribute("fill", "none");
                    pathElem.setAttribute("stroke", "#10b981");
                    pathElem.setAttribute("stroke-width", "3.5");
                    pathElem.setAttribute("stroke-linecap", "round");
                    pathElem.setAttribute("stroke-linejoin", "round");
                    pathElem.setAttribute("stroke-opacity", "0.75");
                    pathElem.setAttribute("class", "pointer-events-none");

                    pathsGroup.appendChild(pathElem);
                }
            });
        }

        // Select specific region on click
        function selectRegion(id) {
            state.selectedRegionId = (state.selectedRegionId === id) ? null : id;
            buildRegionsStack();

            state.regions.forEach(reg => {
                const rect = document.getElementById(`svg-reg-${reg.id}`);
                if (rect) {
                    if (reg.id === state.selectedRegionId) {
                        rect.setAttribute("fill", "rgba(99, 102, 241, 0.45)");
                        rect.setAttribute("stroke", "#ffffff");
                        rect.setAttribute("stroke-width", "3.5");
                    } else {
                        rect.setAttribute("fill", "rgba(99, 102, 241, 0.15)");
                        rect.setAttribute("stroke", "#6366f1");
                        rect.setAttribute("stroke-width", "2.5");
                    }
                }
            });
        }

        // Set up Event Listeners
        function setupEvents() {
            // Live parsing CSS modifications
            cssTextarea.addEventListener('input', parseAndCompileCSS);

            // Tab Switching View Controls
            tabCss.addEventListener('click', () => switchTab('css'));
            tabVectors.addEventListener('click', () => switchTab('vectors'));

            // View transformations Controls
            btnZoomIn.addEventListener('click', () => adjustZoom(0.15));
            btnZoomOut.addEventListener('click', () => adjustZoom(-0.15));
            btnFit.addEventListener('click', autoFit);
            btnReset.addEventListener('click', autoFit);

            btnToggleGrid.addEventListener('click', () => {
                state.gridVisible = !state.gridVisible;
                gridOverlay.style.opacity = state.gridVisible ? '1' : '0';
                btnToggleGrid.classList.toggle('bg-indigo-600/20');
                btnToggleGrid.classList.toggle('bg-slate-800');
            });

            btnApplyJson.addEventListener('click', () => {
                try {
                    const parsed = JSON.parse(jsonTextarea.value);
                    if (parsed.shapes) state.shapes = parsed.shapes;
                    renderVectors();
                } catch (e) {
                    alert("Incorrect JSON vector coordinates layout");
                }
            });

            // Pan Controls
            canvasViewport.addEventListener('mousedown', (e) => {
                state.isDragging = true;
                state.startX = e.clientX - state.panX;
                state.startY = e.clientY - state.panY;
            });

            canvasViewport.addEventListener('mousemove', (e) => {
                const rect = canvasViewport.getBoundingClientRect();
                const relativeX = (e.clientX - rect.left - state.panX) / state.zoom;
                const relativeY = (e.clientY - rect.top - state.panY) / state.zoom;
                coordDisplay.innerText = `X: ${Math.round(relativeX)}, Y: ${Math.round(relativeY)}`;

                if (state.isDragging) {
                    state.panX = e.clientX - state.startX;
                    state.panY = e.clientY - state.startY;
                    updateTransform();
                }
            });

            window.addEventListener('mouseup', () => {
                state.isDragging = false;
            });

            // Local reference image uploader for hot-spot background alignment checks
            bgUploader.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        bgTemplate.setAttributeNS("http://www.w3.org/1999/xlink", "href", event.target.result);
                    };
                    reader.readAsDataURL(file);
                }
            });
        }

        // Switch Tab views
        function switchTab(tab) {
            state.activeTab = tab;
            if (tab === 'css') {
                tabCss.className = "flex-1 py-3.5 text-center text-[11px] font-bold uppercase tracking-wider border-b-2 border-indigo-500 text-slate-100 focus:outline-none";
                tabVectors.className = "flex-1 py-3.5 text-center text-[11px] font-bold uppercase tracking-wider border-b-2 border-transparent text-slate-400 hover:text-slate-100 focus:outline-none";
                panelCss.classList.remove('hidden');
                panelVectors.classList.add('hidden');
            } else {
                tabCss.className = "flex-1 py-3.5 text-center text-[11px] font-bold uppercase tracking-wider border-b-2 border-transparent text-slate-400 hover:text-slate-100 focus:outline-none";
                tabVectors.className = "flex-1 py-3.5 text-center text-[11px] font-bold uppercase tracking-wider border-b-2 border-indigo-500 text-slate-100 focus:outline-none";
                panelCss.classList.add('hidden');
                panelVectors.classList.remove('hidden');
            }
        }

        // Zoom view logic
        function adjustZoom(factor) {
            const oldZoom = state.zoom;
            state.zoom = Math.max(0.1, Math.min(10, state.zoom + factor));
            
            const viewportWidth = canvasViewport.clientWidth;
            const viewportHeight = canvasViewport.clientHeight;
            state.panX = viewportWidth / 2 - (viewportWidth / 2 - state.panX) * (state.zoom / oldZoom);
            state.panY = viewportHeight / 2 - (viewportHeight / 2 - state.panY) * (state.zoom / oldZoom);
            
            updateTransform();
        }

        // Align and center the design canvas relative to standard viewing boundaries
        function autoFit() {
            const containerWidth = canvasViewport.clientWidth;
            const containerHeight = canvasViewport.clientHeight;
            const ratioX = containerWidth / state.viewport.width;
            const ratioY = containerHeight / state.viewport.height;
            state.zoom = Math.min(ratioX, ratioY) * 0.95;

            state.panX = (containerWidth - (state.viewport.width * state.zoom)) / 2;
            state.panY = (containerHeight - (state.viewport.height * state.zoom)) / 2;

            updateTransform();
        }

        function updateTransform() {
            drawingCanvas.style.transform = `translate(${state.panX}px, ${state.panY}px) scale(${state.zoom})`;
        }
    </script>
</body>
</html>
